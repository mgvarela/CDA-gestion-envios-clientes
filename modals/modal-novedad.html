<div class="modal fade" id="modalNuevaNovedad" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-megaphone text-primary me-2"></i>Nueva Novedad Operativa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formNuevaNovedad">
          <div class="mb-2"><label class="form-label">ID Novedad</label><input type="text" id="nId" class="form-control" placeholder="PNO005" required></div>
          <div class="mb-2"><label class="form-label">Categoría</label><input type="text" id="nCategoria" class="form-control" placeholder="Medio de pago / Logística" required></div>
          <div class="mb-2"><label class="form-label">Descripción</label><textarea id="nDescripcion" class="form-control" rows="3" required></textarea></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarNuevaNovedad()">Guardar Novedad</button>
      </div>
    </div>
  </div>
</div>
