<section class="seguimiento-view">
<!-- CABECERA DE SECCIÓN -->
<div class="view-page-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-3">
  <h2><i class="bi bi-geo-alt text-primary me-2"></i>Seguimiento de Entregas</h2>
  <div>
    <button class="btn btn-primary me-2 btn-sm" data-module="envios" data-bs-toggle="modal" data-bs-target="#modalCliente"><i class="bi bi-person-plus"></i> Nuevo Cliente</button>
    <button class="btn btn-dark btn-sm" data-module="plantillas" data-bs-toggle="modal" data-bs-target="#modalTemplates"><i class="bi bi-file-earmark-code"></i> Plantillas</button>
  </div>
</div>

<!-- BUSCADOR MULTI-PROVEEDOR LOGÍSTICO -->
<div class="tracking-panel p-3 mb-4">
  <h6 class="fw-bold mb-2 text-dark"><i class="bi bi-truck text-primary me-1"></i> Consulta de Estado de Entrega Multilogística</h6>
  <div class="row g-2 align-items-center">
    <div class="col-md-6 col-lg-5">
      <div class="input-group input-group-sm">
        <select class="form-select" id="selectProveedor" style="max-width: 150px;">
          <option value="dispatchtrack" selected>DispatchTrack</option>
          <option value="flex">Mercado Flex</option>
        </select>
        <input type="text" id="inputFactura" class="form-control" placeholder="N° Factura o Envío..." onkeyup="if(event.key === 'Enter') buscarEstadoPorFactura()">
        <button class="btn btn-primary" onclick="buscarEstadoPorFactura()"><i class="bi bi-search"></i> Buscar</button>
      </div>
    </div>
    <div class="col-md-6 col-lg-7" id="resultadoLogistica">
      <small class="text-muted"><i class="bi bi-info-circle me-1"></i> Seleccioná el operador logístico e ingresá el comprobante para ver los datos del contacto.</small>
    </div>
  </div>
</div>
</section>
