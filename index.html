<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Ecommerce - Casa del Audio</title>
  
  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginSection" class="auth-container">
  <div class="card p-4">
    <h3 class="text-center mb-3"><i class="bi bi-lock text-primary"></i> Iniciar Sesión</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" required placeholder="tu@email.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>

<!-- LAYOUT PRINCIPAL -->
<div id="appSection" class="container-fluid d-none p-0">
  <button class="btn sidebar-toggle" type="button" onclick="toggleSidebar()" aria-label="Abrir menú" aria-controls="appSidebar">
    <i class="bi bi-list"></i>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="row g-0">
    
    <!-- Sidebar / Navegación -->
    <nav class="col-md-3 col-lg-2 sidebar p-3" id="appSidebar">
      <h5 class="text-white mb-4 ps-2"><img class="img-logo" src="css/img/logo_white.png" alt="Control Ecommerce" class="img-fluid">Control Ecommerce</h5>
      <div class="mb-3 ps-2">
        <span class="badge bg-light text-dark">Rol: <span id="currentUserRoleLabel">viewer</span></span>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="navegar('envios', this)">
            <i class="bi bi-truck me-2"></i> Envíos y Pedidos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="navegar('reviews', this)">
            <i class="bi bi-star-fill me-2"></i> Solicitar Reviews
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#" onclick="navegar('admin', this)">
            <i class="bi bi-pie-chart me-2"></i> Admin novedades
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="navegar('arrepentimiento', this)">
            <i class="bi bi-arrow-counterclockwise me-2"></i> Arrepentimiento
          </a>
        </li>
      </ul>
      <hr class="text-secondary">
      <button class="btn btn-danger w-100 btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Salir</button>
    </nav>

    <!-- Contenido Principal Dinámico -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="mainContent">
      <!-- Las vistas HTML se cargan dinámicamente acá -->
    </main>

  </div>
</div>

<!-- COMPONENTES MODALES -->
<div id="modalsContainer"></div>

<!-- Scripts Modulares -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/envios.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
