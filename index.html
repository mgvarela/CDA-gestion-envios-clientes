<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Ecommerce - Casa del Audio</title>
  
  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginSection" class="auth-container">
  <div class="card p-4">
    <img class="logo-login" src="./css/img/logo_color.png" alt="logo_casadelaudio">
    <h3 class="text-center mb-3"><i class="bi bi-lock text-primary"></i> Iniciar Sesión</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" required placeholder="tu@email.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>

<!-- LAYOUT PRINCIPAL -->
<div id="appSection" class="container-fluid d-none p-0">
  <button class="btn sidebar-toggle" type="button" onclick="toggleSidebar()" aria-label="Abrir menú" aria-controls="appSidebar">
    <i class="bi bi-list"></i>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="row g-0">
    
    <!-- Sidebar / Navegación -->
    <nav class="col-md-3 col-lg-2 sidebar p-3" id="appSidebar">
      <div class="sidebar-header">
        <h5 class="text-white mb-4 ps-2"><img class="img-logo" src="css/img/logo_white.png" alt="Control Ecommerce"><span class="sidebar-title-label">Control Ecommerce</span></h5>
        <button class="sidebar-collapse-button" type="button" onclick="toggleSidebarCompact()" aria-label="Contraer menú" title="Contraer menú">
          <i class="bi bi-chevron-left"></i>
        </button>
      </div>
      <div class="mb-3 ps-2">
        <span class="badge bg-light text-dark sidebar-role-label">Rol: <span id="currentUserRoleLabel">viewer</span></span>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item" data-module="admin">
          <a class="nav-link active" href="#" onclick="navegar('admin', this)">
            <i class="bi bi-pie-chart me-2"></i><span class="sidebar-label">Admin novedades</span>
          </a>
        </li>
        <li class="nav-item" data-module="envios">
          <a class="nav-link" href="#" onclick="navegar('envios', this)">
            <i class="bi bi-truck me-2"></i><span class="sidebar-label">Envíos y Pedidos</span>
          </a>
        </li>
       
        <li class="nav-item" data-module="pedidos">
          <a class="nav-link" href="#" onclick="navegar('pedidos', this)">
            <i class="bi bi-box-seam me-2"></i><span class="sidebar-label">Pedidos de Mercadería</span>
          </a>
        </li>
        <li class="nav-item" data-module="facturacion">
          <a class="nav-link" href="#" onclick="navegar('facturacion', this)">
            <i class="bi bi-receipt-cutoff me-2"></i><span class="sidebar-label">Facturación</span>
          </a>
        </li>
        <!--<li class="nav-item">
          <a class="nav-link" href="#" onclick="navegar('reviews', this)">
            <i class="bi bi-star-fill me-2"></i><span class="sidebar-label">Solicitar Reviews</span>
          </a>
        </li>-->
        <li class="nav-item" data-module="arrepentimiento">
          <a class="nav-link" href="#" onclick="navegar('arrepentimiento', this)">
            <i class="bi bi-arrow-counterclockwise me-2"></i><span class="sidebar-label">Arrepentimiento</span>
          </a>
        </li>
         <li class="nav-item" data-module="seguimiento">
          <a class="nav-link" href="#" onclick="navegar('seguimiento', this)">
            <i class="bi bi-geo-alt me-2"></i><span class="sidebar-label">Seguimiento</span>
          </a>
        </li>
        <li class="nav-item" data-module="plantillas">
          <a class="nav-link" href="#" onclick="abrirModalPlantillas(); return false;">
            <i class="bi bi-file-earmark-code me-2"></i><span class="sidebar-label">Plantillas</span>
          </a>
        </li>
      </ul>
      <hr class="text-secondary">
      <button class="btn btn-danger w-100 btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span class="sidebar-label"> Salir</span></button>
    </nav>

    <!-- Contenido Principal Dinámico -->
    <main class="app-main px-md-4 py-4" id="mainContent">
      <!-- Las vistas HTML se cargan dinámicamente acá -->
    </main>

  </div>
</div>

<!-- COMPONENTES MODALES -->
<div id="modalsContainer"></div>


<!-- CONTENEDOR DE NOTIFICACIONES FLOTANTES -->
<div id="toastContainer"></div>

<!-- MODAL REUTILIZABLE DE CONFIRMACIÓN -->
<div class="modal fade" id="modalConfirmacionGlobal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fs-6 fw-bold" id="modalConfirmacionTitulo">Confirmar acción</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-3" id="modalConfirmacionMensaje">
        ¿Estás seguro de realizar esta acción?
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnModalConfirmarCancelar" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-sm btn-primary" id="btnModalConfirmarAceptar">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts Modulares -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js?v=20260922"></script>
<script src="js/auth.js?v=20260922"></script>
<script src="js/admin.js?v=20260923"></script>
<script src="js/pedidos.js?v=20260923"></script>
<script src="js/facturacion.js?v=20260923"></script>
<script src="js/seguimiento.js?v=20260922"></script>
<script src="js/arrepentimiento.js?v=20260923"></script>
</body>
</html>
